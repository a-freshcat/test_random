<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>真卡奴就玩弗一把</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@400;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0a0c10;
            background-image: radial-gradient(circle at 10% 90%, rgba(255, 94, 58, 0.06) 0%, transparent 50%),
                              radial-gradient(circle at 90% 10%, rgba(0, 212, 255, 0.05) 0%, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            font-family: 'Exo 2', sans-serif;
            color: #e8e6e3;
        }

        /* ----- 难度选择浮层 ----- */
        #difficultyOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 12, 16, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(6px);
            transition: opacity 0.5s ease;
        }
        #difficultyOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .difficulty-box {
            background: #14181f;
            padding: 3rem 4rem;
            border-radius: 0 60px 0 60px;
            border-left: 8px solid #ff5e3a;
            box-shadow: -16px 16px 0 rgba(255, 94, 58, 0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        .difficulty-box h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #f2eee9;
            margin-bottom: 0.5rem;
        }
        .difficulty-box p {
            font-family: 'Exo 2', sans-serif;
            color: #8a9baa;
            margin-bottom: 2rem;
            font-size: 1rem;
        }
        .difficulty-box .btn-group {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .difficulty-box .btn-group button {
            background: #1e2630;
            border: 2px solid #2a3340;
            padding: 0.8rem 2.2rem;
            border-radius: 0 30px 0 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #f2eee9;
            cursor: pointer;
            transition: 0.2s;
            min-width: 120px;
        }
        .difficulty-box .btn-group button:hover {
            border-color: #ff5e3a;
            transform: scale(1.05);
            background: #2a3340;
        }
        .difficulty-box .btn-group button .sub {
            display: block;
            font-size: 0.7rem;
            font-family: 'Exo 2', sans-serif;
            color: #6a7a8a;
            margin-top: 0.2rem;
        }

        /* ----- 主游戏样式 ----- */
        .game-container {
            max-width: 1300px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 2.5rem;
            align-items: start;
        }

        .main-area {
            background: #14181f;
            padding: 2.5rem 2rem;
            border-radius: 0 60px 0 60px;
            border-left: 8px solid #ff5e3a;
            transform: rotate(-0.4deg);
            transition: transform 0.25s ease;
            box-shadow: -16px 16px 0 rgba(255, 94, 58, 0.06);
        }

        .main-area:hover { transform: rotate(0deg) scale(1.01); }

        .badge {
            display: inline-block;
            background: #ff5e3a;
            color: #0a0c10;
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            padding: 0.3rem 1.2rem;
            border-radius: 0 30px 0 30px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            font-family: 'Orbitron', sans-serif;
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .score-header .score {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #00d4ff;
        }

        .score-header .score span { color: #ff5e3a; }

        .score-header .title-badge {
            background: #1e2630;
            padding: 0.3rem 1.2rem;
            border-radius: 0 30px 0 30px;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.2rem;
            color: #f5b774;
            border: 2px solid #f5b774;
        }

        .attempts {
            margin: 0.5rem 0 1rem 0;
            font-size: 1.4rem;
        }
        .attempts .heart { color: #d45a6a; font-size: 2rem; margin-right: 0.2rem; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin: 1.5rem 0;
        }
        .input-row {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            position: relative;
        }
        .input-row label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: #6a7a8a;
            min-width: 60px;
        }
        .input-row input {
            flex: 1;
            min-width: 120px;
            background: #1e2630;
            border: 2px solid #2a3340;
            padding: 0.6rem 1rem;
            border-radius: 0 30px 0 30px;
            font-family: 'Exo 2', sans-serif;
            font-size: 1rem;
            color: #f2eee9;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-row input:focus { border-color: #ff5e3a; }
        .input-row input:disabled { opacity: 0.4; }

        .input-row input::-webkit-calendar-picker-indicator {
            filter: invert(0.6);
            cursor: pointer;
        }

        .submit-row {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .submit-row button {
            background: #ff5e3a;
            border: none;
            padding: 0.7rem 2.5rem;
            border-radius: 0 30px 0 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            color: #0a0c10;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 0.1em;
        }
        .submit-row button:hover { transform: scale(1.05); background: #ff7a5a; }
        .submit-row button:disabled { opacity: 0.3; pointer-events: none; }

        .feedback-area {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 0.8rem 0;
            font-family: 'Exo 2', monospace;
            font-weight: 700;
            font-size: 1.2rem;
            align-items: center;
        }
        .feedback-item {
            display: flex;
            gap: 0.4rem;
            align-items: center;
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
            background: #1e2630;
        }
        .feedback-item .label { color: #8a9baa; font-weight: 400; font-size: 0.8rem; }
        .feedback-item .value.correct { color: #7bdf9e; }
        .feedback-item .value.wrong { color: #d45a6a; text-decoration: line-through; }

        .message {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.2rem;
            min-height: 2.5rem;
            padding: 0.3rem 0;
            border-top: 2px solid rgba(255,255,255,0.04);
        }
        .message.success { color: #7bdf9e; }
        .message.fail { color: #d45a6a; }
        .message.info { color: #f5b774; }

        /* 提示区：显示角色宗教程度 */
        .hint-area {
            background: #1e2630;
            padding: 0.6rem 1.2rem;
            border-radius: 0 20px 0 20px;
            border-left: 4px solid #f5b774;
            margin: 0.5rem 0 0.2rem 0;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.1rem;
            color: #f5b774;
            min-height: 2.8rem;
            display: flex;
            align-items: center;
        }
        .hint-area .hint-text {
            color: #f2eee9;
        }

        .restart-btn {
            background: #00d4ff;
            border: none;
            padding: 0.5rem 1.8rem;
            border-radius: 0 30px 0 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            color: #0a0c10;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 0.5rem;
        }
        .restart-btn:hover { transform: scale(1.05); background: #44e0ff; }

        .side-area {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            transform: rotate(0.6deg);
        }

        .ref-box {
            background: #14181f;
            padding: 1.8rem 1.5rem;
            border-radius: 40px 0 40px 0;
            border-right: 6px solid #00d4ff;
            box-shadow: 12px 12px 0 rgba(0, 212, 255, 0.05);
        }
        .ref-box h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: #6a7a8a;
            margin-bottom: 0.8rem;
        }
        .ref-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.2rem 0.6rem;
            font-size: 0.85rem;
            color: #b0c0d0;
        }
        .ref-grid .item { padding: 0.15rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .ref-grid .item .highlight { color: #f2eee9; font-weight: 600; }

        .rank-box {
            background: #14181f;
            padding: 1.8rem 1.5rem;
            border-radius: 0 40px 0 40px;
            border-left: 6px solid #ff5e3a;
            box-shadow: -12px 12px 0 rgba(255, 94, 58, 0.05);
        }
        .rank-box h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: #6a7a8a;
            margin-bottom: 0.8rem;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
            padding: 0.3rem 0;
            font-size: 0.9rem;
            color: #b0c0d0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .rank-item .value { font-weight: 700; color: #f2eee9; }
        .rank-item .value.best { color: #ff5e3a; }

        .chord-effect { animation: chordPulse 0.6s ease; }
        @keyframes chordPulse {
            0% { transform: scale(1); filter: brightness(1); }
            30% { transform: scale(1.04); filter: brightness(1.3); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        @media (max-width: 900px) {
            .game-container { grid-template-columns: 1fr; gap: 1.5rem; }
            .main-area, .side-area { grid-column: 1; }
            .difficulty-box { padding: 2rem 1.5rem; }
        }

        .watermark {
            position: fixed;
            bottom: 1rem;
            right: 1.5rem;
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            color: #2a3340;
            letter-spacing: 0.15em;
            opacity: 0.3;
            pointer-events: none;
        }
    </style>
</head>
<body>

<!-- ====== 难度选择浮层 ====== -->
<div id="difficultyOverlay">
    <div class="difficulty-box">
        <h1>🐾 选择难度</h1>
        <p>选几条命开始你的挑战？</p>
        <div class="btn-group">
            <button id="diff3">
                3 条命
                <span class="sub">卡奴专用四词条</span>
            </button>
            <button id="diff4">
                4 条命
                <span class="sub">mmr适用3词条</span>
            </button>
        </div>
    </div>
</div>

        const mainArea = document.getElementById('mainArea');
        const currentScore = document.getElementById('currentScore');
        const titleBadge = document.getElementById('titleBadge');
        const attemptsDisplay = document.getElementById('attemptsDisplay');
        const hintArea = document.getElementById('hintArea');
        const factionInput = document.getElementById('factionInput');
        const nameInput = document.getElementById('nameInput');
        const hairInput = document.getElementById('hairInput');
        const popularityInput = document.getElementById('popularityInput');
        const popularityRow = document.getElementById('popularityRow');
        const submitBtn = document.getElementById('submitBtn');
        const restartBtn = document.getElementById('restartBtn');
        const feedbackArea = document.getElementById('feedbackArea');
        const message = document.getElementById('message');
        const refGrid = document.getElementById('refGrid');
        const bestScore = document.getElementById('bestScore');
        const recent1 = document.getElementById('recent1');
        const recent2 = document.getElementById('recent2');
        const recent3 = document.getElementById('recent3');
        const clearRankBtn = document.getElementById('clearRankBtn');

        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function getTitle(score) {
            if (score <= 0) return '入门卡卫兵';
            if (score <= 3) return '猫娘躯体化';
            if (score <= 7) return '难道你真是奇点猫？';
            if (score <= 12) return '我去卡奴！';
            if (score <= 18) return '允许启动';
            return '永久月卡猫娘！';
        }

        function updateTitle() { titleBadge.textContent = getTitle(score); }

        function loadRank() {
            const data = JSON.parse(localStorage.getItem('karabiyo_rank_v5') || '{"best":0,"recent":[]}');
            bestScore.textContent = data.best || '-';
            const recents = data.recent || [];
            const fill = ['-', '-', '-'];
            for (let i = 0; i < Math.min(recents.length, 3); i++) fill[i] = recents[i];
            recent1.textContent = fill[0];
            recent2.textContent = fill[1];
            recent3.textContent = fill[2];
        }

        function saveScore(score) {
            const data = JSON.parse(localStorage.getItem('karabiyo_rank_v5') || '{"best":0,"recent":[]}');
            if (score > data.best) data.best = score;
            data.recent.unshift(score);
            if (data.recent.length > 3) data.recent = data.recent.slice(0, 3);
            localStorage.setItem('karabiyo_rank_v5', JSON.stringify(data));
            loadRank();
        }

        function updateAttempts() {
            const hearts = '❤️'.repeat(attempts) + '🖤'.repeat(maxAttempts - attempts);
            attemptsDisplay.innerHTML = hearts.split('').map(c => `<span class="heart">${c}</span>`).join('');
        }

        function loadRefGrid() {
            refGrid.innerHTML = '';
            characters.forEach(c => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<span class="highlight">${c.name}</span> · ${c.faction} · ${c.hair}`;
                refGrid.appendChild(div);
            });
        }

        function loadNewRound() {
            if (gameOver) return;
            const idx = getRandomInt(0, characters.length - 1);
            currentChar = characters[idx];
            attempts = maxAttempts;
            answered = false;
            updateAttempts();
            factionInput.value = '';
            nameInput.value = '';
            hairInput.value = '';
            popularityInput.value = '';
            factionInput.disabled = false;
            nameInput.disabled = false;
            hairInput.disabled = false;
            popularityInput.disabled = false;
            submitBtn.disabled = false;
            feedbackArea.innerHTML = '';
            message.textContent = '';
            message.className = 'message';

            // 根据难度显示/隐藏宗教度输入框，并更新提示
            if (isFourFields) {
                popularityRow.style.display = 'flex';
                hintArea.innerHTML = `<span class="hint-text">🔍 宗教度提示：角色人气也是衡量的标准！ </span>`;
            } else {
                popularityRow.style.display = 'none';
                hintArea.innerHTML = `<span style="color:#6a7a8a;">💡 经典模式，无额外提示</span>`;
            }

            factionInput.focus();
      }

        function endGame() {
            gameOver = true;
            factionInput.disabled = true;
            nameInput.disabled = true;
            hairInput.disabled = true;
            popularityInput.disabled = true;
            submitBtn.disabled = true;
            if (score > 0) saveScore(score);
            message.textContent = `😿 真是杂鱼猫娘，最终积分是：${score}`;
            message.className = 'message fail';
        }

        function handleSubmit() {
            if (answered || gameOver || !currentChar) return;

            const f = factionInput.value.trim();
            const n = nameInput.value.trim();
            const h = hairInput.value.trim();
            // 根据模式决定是否读取宗教度
            let p = null;
            if (isFourFields) {
                p = popularityInput.value.trim();
                if (!f || !n || !h || !p) {
                    message.textContent = '🐾 四个空都要填喵～';
                    message.className = 'message info';
                    return;
                }
            } else {
                if (!f || !n || !h) {
                    message.textContent = '🐾 三个空都要填喵～';
                    message.className = 'message info';
                    return;
                }
            }

            const correctF = f === currentChar.faction;
            const correctN = n === currentChar.name;
            const correctH = h === currentChar.hair;
            let correctP = true;
            if (isFourFields) {
                // 宗教度比较：将用户输入转为数字，如 "4星" -> 4
                const userPop = parseInt(p.replace('星', ''));
                correctP = (userPop === currentChar.popularity);
            }

            // 构建反馈HTML（动态决定是否显示宗教度）
            let feedbackHTML = `
                <div class="feedback-item"><span class="label">阵营</span><span class="value ${correctF ? 'correct' : 'wrong'}">${correctF ? '✅' : '❌'} ${f}</span></div>
                <div class="feedback-item"><span class="label">角色</span><span class="value ${correctN ? 'correct' : 'wrong'}">${correctN ? '✅' : '❌'} ${n}</span></div>
                <div class="feedback-item"><span class="label">发色</span><span class="value ${correctH ? 'correct' : 'wrong'}">${correctH ? '✅' : '❌'} ${h}</span></div>
            `;
            if (isFourFields) {
                feedbackHTML += `<div class="feedback-item"><span class="label">宗教度</span><span class="value ${correctP ? 'correct' : 'wrong'}">${correctP ? '✅' : '❌'} ${p}</span></div>`;
            }
            feedbackArea.innerHTML = feedbackHTML;

            const allCorrect = correctF && correctN && correctH && correctP;

            if (allCorrect) {
                answered = true;
                score++;
                currentScore.textContent = score;
                updateTitle();
                factionInput.disabled = true;
                nameInput.disabled = true;
                hairInput.disabled = true;
                popularityInput.disabled = true;
                submitBtn.disabled = true;
                message.textContent = `🎉 完美！就是 ${currentChar.name} 喵～ 继续！`;
                message.className = 'message success';
                mainArea.classList.add('chord-effect');
                setTimeout(() => mainArea.classList.remove('chord-effect'), 700);
                setTimeout(() => loadNewRound(), 1000);
            } else {
                attempts--;
                updateAttempts();
                if (attempts === 0) {
                    answered = true;
                    factionInput.disabled = true;
                    nameInput.disabled = true;
                    hairInput.disabled = true;
                    popularityInput.disabled = true;
                    submitBtn.disabled = true;
                    let extra = isFourFields ? ` · 宗教程度${currentChar.popularity}星级` : '';
                    message.textContent = `❌ 机会用尽，正确答案：${currentChar.faction} · ${currentChar.name} · ${currentChar.hair}${extra} 喵～`;
                    message.className = 'message fail';
                    if (score > 0) saveScore(score);
                    gameOver = true;
                } else {
                    message.textContent = `❌ 卡奴再试试！还剩 ${attempts} 次机会`;
                    message.className = 'message fail';
                    factionInput.value = '';
                    nameInput.value = '';
                    hairInput.value = '';
                    popularityInput.value = '';
                    factionInput.focus();
                }
            }
        }

        function restartGame() {
            // 不重复保存，由 endGame 负责
            score = 0;
            currentScore.textContent = score;
            updateTitle();
            gameOver = false;
            loadNewRound();
            feedbackArea.innerHTML = '';
            message.textContent = '🔄 新挑战开始喵～';
            message.className = 'message info';
            mainArea.classList.remove('chord-effect');
        }

        // ----- 难度选择逻辑 -----
        let difficultyChosen = false;

        function startGame(selectedAttempts) {
            maxAttempts = selectedAttempts;
            attempts = maxAttempts;
            // 3条命模式启用4个填空，4条命模式禁用
            isFourFields = (maxAttempts === 3);
            score = 0;
            currentScore.textContent = score;
            updateTitle();
            gameOver = false;
            document.getElementById('difficultyOverlay').classList.add('hidden');
            document.getElementById('gameContainer').style.display = 'grid';
            loadNewRound();
            loadRank();
            loadRefGrid();
            difficultyChosen = true;
        }

        document.getElementById('diff3').addEventListener('click', function() {
            if (!difficultyChosen) startGame(3);
        });
        document.getElementById('diff4').addEventListener('click', function() {
            if (!difficultyChosen) startGame(4);
        });

        // ----- 事件绑定 -----
        submitBtn.addEventListener('click', handleSubmit);
        [factionInput, nameInput, hairInput, popularityInput].forEach(inp => {
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); handleSubmit(); }
            });
        });
        restartBtn.addEventListener('click', restartGame);

        clearRankBtn.addEventListener('click', function() {
            if (confirm('确定要清空所有排行榜记录吗喵？')) {
                localStorage.removeItem('karabiyo_rank_v5');
                loadRank();
                message.textContent = '🗑️ 排行榜已重置喵～';
                message.className = 'message info';
            }
        });

        // 预加载
        loadRank();
        loadRefGrid();
        document.getElementById('gameContainer').style.display = 'none';
    })();
</script>
</body>
</html>
